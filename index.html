<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Shield | Secure Your Digital Future</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #e0e0e0;
            background-color: #0a0b10;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .navbar {
            height: 80px;
            display: flex;
            align-items: center;
            background: rgba(10, 11, 16, 0.98);
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo { font-size: 1.5rem; letter-spacing: 2px; color: #fff; font-weight: 700; text-decoration: none; }
        .logo span { color: #3b82f6; font-weight: 300; }

        .nav-links { list-style: none; display: flex; align-items: center; }
        .nav-links li a { text-decoration: none; color: #9ca3af; margin-left: 30px; font-size: 0.9rem; transition: 0.3s; }
        .btn-nav { background: #3b82f6; color: white !important; padding: 8px 18px; border-radius: 4px; }

        /* Hero */
        .hero {
            padding: 160px 0;
            text-align: center;
            background: radial-gradient(circle at center, #111827 0%, #0a0b10 100%);
        }

        .hero h2 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin-bottom: 20px;
            color: #fff;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 40px;
            color: #9ca3af;
        }

        .btn-hero {
            display: inline-block;
            text-decoration: none;
            background: #3b82f6;
            color: white;
            padding: 18px 35px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        section { padding: 100px 0; }
        .section-title { text-align: center; margin-bottom: 60px; }
        .section-title h3 { font-size: 2.5rem; color: #fff; }

        #solutions { background: #0f172a; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { background: #1e293b; padding: 40px; border-radius: 12px; border: 1px solid #334155; }

        #get-started { background: #0a0b10; text-align: center; }
        .contact-box { 
            max-width: 500px; 
            margin: 0 auto; 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 15px; 
            border: 1px solid #3b82f6; 
        }
        
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: #0f172a; 
            border: 1px solid #334155; 
            color: white; 
            border-radius: 5px; 
            outline: none;
        }

        input:focus { border-color: #3b82f6; }

        .btn-block { 
            width: 100%; 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 5px; 
        }

        /* Success Message Styling */
        #success-msg {
            display: none;
            color: #10b981;
            font-weight: bold;
            margin-top: 20px;
        }

        footer { padding: 40px 0; text-align: center; border-top: 1px solid #1f2937; font-size: 0.8rem; color: #4b5563; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="#" class="logo">CRYPTO<span>SHIELD</span></a>
            <ul class="nav-links">
                <li><a href="#solutions">Solutions</a></li>
                <li><a href="#get-started" class="btn-nav">Get Started</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h2>Secure. Shielded. Sovereign.</h2>
            <p>The ultimate defense for your digital assets. We provide institutional-grade encryption for the everyday investor.</p>
            <a href="#get-started" class="btn-hero">Start Protection Now</a>
        </div>
    </header>

    <section id="solutions">
        <div class="container">
            <div class="section-title">
                <h3>Our Core Solutions</h3>
            </div>
            <div class="grid">
                <div class="card">
